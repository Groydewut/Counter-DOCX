<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>🎀 Подсчёт страниц 🎀</title>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                padding: 24px 16px;
                display: flex;
                justify-content: center;
                align-items: center;
                /* Нежный розово-зефирный градиент */
                background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #ffd1dc 100%);
                color: #6d4c57;
                font-family: "Segoe UI", system-ui, sans-serif;
                position: relative;
                overflow-x: hidden;
            }

            /* Декоративные плавающие элементы на фоне */
            body::before,
            body::after {
                content: "🌸";
                position: absolute;
                font-size: 3rem;
                opacity: 0.3;
                animation: float 6s ease-in-out infinite;
            }
            body::before {
                top: 10%;
                left: 10%;
            }
            body::after {
                bottom: 10%;
                right: 10%;
                animation-delay: 3s;
            }

            @keyframes float {
                0%,
                100% {
                    transform: translateY(0) rotate(0deg);
                }
                50% {
                    transform: translateY(-20px) rotate(20deg);
                }
            }

            /* Милая карточка */
            .card {
                width: 100%;
                max-width: 440px;
                padding: 32px 28px;
                background: rgba(255, 255, 255, 0.9);
                border: 3px solid #ffb6c1;
                border-radius: 24px;
                box-shadow: 0 12px 40px rgba(255, 182, 193, 0.4);
                backdrop-filter: blur(5px);
                transition: transform 0.3s ease;
            }

            .card:hover {
                transform: scale(1.01);
            }

            h1 {
                margin: 0 0 12px;
                font-size: 26px;
                color: #ff69b4;
                text-align: center;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
            }

            .description {
                margin: 0 0 24px;
                color: #8b6c76;
                line-height: 1.5;
                text-align: center;
                font-size: 15px;
            }

            .file-label {
                display: block;
                margin-bottom: 10px;
                font-weight: 600;
                color: #ff69b4;
            }

            /* Стилизация нежного поля выбора файла */
            /* Прячем стандартный страшный инпут */
            input[type="file"] {
                position: absolute;
                left: -9999px;
                opacity: 0;
            }

            /* Контейнер для выравнивания новой кнопки и текста */
            .file-upload-wrapper {
                display: flex;
                align-items: center;
                gap: 12px;
                width: 100%;
                padding: 8px;
                border: 2px dashed #ffb6c1;
                border-radius: 14px;
                background: #fff9fa;
                transition: all 0.3s ease;
            }

            .file-upload-wrapper:hover {
                border-color: #ff69b4;
                background: #fff0x3;
            }

            /* Наша новая милая кнопочка вместо "Обзор..." */
            .custom-file-button {
                display: inline-block;
                padding: 8px 16px;
                background: #ffe4e1;
                border: 1px solid #ffb6c1;
                color: #db5a88;
                border-radius: 10px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s ease;
                user-select: none;
            }

            .custom-file-button:hover {
                background: #ffb6c1;
                color: white;
                transform: scale(1.03);
            }

            /* Текст с названием выбранного файла */
            .file-name-text {
                font-size: 13px;
                color: #8b6c76;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                flex: 1;
            }

            /* Зефирная розовая кнопочка */
            button {
                width: 100%;
                margin-top: 20px;
                padding: 14px;
                border: 0;
                border-radius: 14px;
                background: linear-gradient(135deg, #ff8da1 0%, #ff69b4 100%);
                color: white;
                font-size: 16px;
                font-weight: 600;
                letter-spacing: 0.5px;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
                transition: all 0.3s ease;
            }

            button:hover {
                background: linear-gradient(135deg, #ff69b4 0%, #e0529c 100%);
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4);
            }

            button:active {
                transform: translateY(0);
            }

            /* Анимация пульсации сердечка при загрузке */
            button:disabled {
                opacity: 0.8;
                background: #ffb6c1;
                cursor: wait;
                animation: pulse 1.5s infinite;
            }

            @keyframes pulse {
                0% {
                    opacity: 0.6;
                }
                50% {
                    opacity: 1;
                }
                100% {
                    opacity: 0.6;
                }
            }

            #status {
                margin-top: 20px;
                line-height: 1.5;
                overflow-wrap: anywhere;
                text-align: center;
                animation: fadeIn 0.4s ease forwards;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Милое отображение результата */
            .result {
                padding: 18px;
                border-radius: 16px;
                background: #fff0f3;
                border: 1px solid #ffd1dc;
                color: #d81b60;
                box-shadow: inset 0 2px 4px rgba(255, 182, 193, 0.2);
            }

            .result strong {
                display: block;
                margin-top: 6px;
                font-size: 36px;
                color: #ff69b4;
                text-shadow: 1px 1px 0px #fff;
            }

            /* Сообщение об ошибке */
            .error {
                color: #c2185b;
                background: #fffeef;
                padding: 12px;
                border-radius: 12px;
                border: 1px solid #ffcdd2;
                display: inline-block;
                width: 100%;
            }

            .hint {
                margin-top: 22px;
                color: #a38f95;
                font-size: 13px;
                line-height: 1.5;
                text-align: center;
            }
        </style>
    </head>

    <body>
        <main class="card">
            <h1>🎀 Подсчёт страниц DOCX 🎀</h1>

            <p class="description">Выберите любимый документ Word, чтобы узнать количество страничек в формате A5 ✨</p>

            <form id="uploadForm">
                <label class="file-label" for="document"> Документ ✨ </label>

                <div class="file-upload-wrapper">
                    <label for="document" class="custom-file-button">✨ Выбрать файл</label>
                    <input type="file" id="document" name="document" accept=".docx" required />
                    <span id="file-name-display" class="file-name-text">Файл не выбран 🐾</span>
                </div>

                <button id="submitButton" type="submit">Рассчитать страницы 💕</button>
            </form>

            <div id="status" aria-live="polite"></div>

            <p class="hint">
                Подсчёт приблизительный 🌸 Реальное количество страниц зависит от шрифта, полей и форматирования
                документа.
            </p>
        </main>

        <script>
            const form = document.getElementById("uploadForm");
            const fileInput = document.getElementById("document");
            const submitButton = document.getElementById("submitButton");
            const status = document.getElementById("status");

            form.addEventListener("submit", async function (event) {
                event.preventDefault();

                const file = fileInput.files[0];

                if (!file) {
                    status.textContent = "💖 Сначала выберите документ.";
                    status.className = "error";
                    return;
                }

                if (!file.name.toLowerCase().endsWith(".docx")) {
                    status.textContent = "🌸 Пожалуйста, выберите файл с расширением .docx.";
                    status.className = "error";
                    return;
                }

                const formData = new FormData(form);

                submitButton.disabled = true;
                submitButton.textContent = "Обрабатываем... ⏱️💝";
                status.className = "";
                status.textContent = "Загружаем документ и считаем странички... 💖";

                try {
                    const response = await fetch("/upload", {
                        method: "POST",
                        body: formData,
                    });

                    const resultText = await response.text();

                    if (!response.ok) {
                        throw new Error(resultText || "Не удалось обработать документ 😿");
                    }

                    const result = JSON.parse(resultText);

                    status.className = "result";
                    status.replaceChildren();

                    const filename = document.createElement("div");
                    filename.textContent = "📄 Документ: " + result.filename;

                    const label = document.createElement("div");
                    label.style.marginTop = "8px";
                    label.textContent = "✨ Примерное количество страниц ✨";

                    const value = document.createElement("strong");
                    value.textContent = "🌸 " + result.pages + " 🌸";

                    status.append(filename, label, value);
                } catch (error) {
                    status.className = "error";
                    status.textContent = error.message || "Ошибка соединения с сервером 😿";
                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent = "Рассчитать страницы 💕";
                }
            });
            const fileNameDisplay = document.getElementById("file-name-display");
            fileInput.addEventListener("change", function () {
                if (this.files && this.files.length > 0) {
                    fileNameDisplay.textContent = "🌸 " + this.files[0].name;
                } else {
                    fileNameDisplay.textContent = "Файл не выбран 🐾";
                }
            });
        </script>
    </body>
</html>
